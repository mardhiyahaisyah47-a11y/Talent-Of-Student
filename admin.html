<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Fundraising | TOS 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#fff8d6,#fff);color:#111}
.container{width:min(480px,100%);margin:auto;padding:30px 20px}
.logo{text-align:center;margin-bottom:18px}
.logo img{width:85px;height:85px;border-radius:50%;object-fit:cover;border:4px solid #111}
h1{text-align:center;font-size:26px;margin-bottom:6px}
.subtitle{text-align:center;color:#666;margin-bottom:22px}
.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.current{background:#f7f7f7;border-radius:12px;padding:16px;line-height:1.8;margin-bottom:20px}
.current strong{font-size:18px}
.field{margin-top:16px}
label{display:block;font-weight:bold;margin-bottom:8px}
input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:#f5c400;box-shadow:0 0 0 3px rgba(245,196,0,.15)}
button{width:100%;border:0;padding:14px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:18px}
button:disabled{opacity:.6;cursor:not-allowed}
.save{background:#111;color:#fff}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;line-height:1.5;font-size:14px}
.success{display:block;background:#e9f9ef;color:#137333}
.error{display:block;background:#fff0f0;color:#c62828}
.info{margin-top:20px;padding:15px;background:#fff8d6;border-radius:12px;line-height:1.6;font-size:14px}
.footer{text-align:center;color:#777;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="container">
  <div class="logo"><img src="logo-tos.jpeg" alt="Logo TOS"></div>
  <h1>Admin TOS 2026</h1>
  <p class="subtitle">Pengelolaan dana fundraising</p>

  <div class="card">
    <div class="current">
      🎯 Target Dana: <strong id="displayTarget">Rp0</strong><br>
      💰 Dana Terkumpul: <strong id="displayCurrent">Rp0</strong><br>
      📊 Progress: <strong id="displayPercentage">0%</strong>
    </div>

    <div class="field">
      <label for="targetAmount">🎯 Target Dana</label>
      <input id="targetAmount" type="number" min="0" value="47005000">
    </div>

    <div class="field">
      <label for="currentAmount">💰 Dana Terkumpul</label>
      <input id="currentAmount" type="number" min="0" value="0">
    </div>

    <button class="save" id="saveButton">💾 Simpan Perubahan</button>
    <div id="message" class="message"></div>

    <div class="info">
      <strong>📌 Cara pakai</strong><br><br>
      Ubah jumlah dana yang sudah diterima panitia, lalu klik
      <strong>Simpan Perubahan</strong>.<br><br>
      Data akan tersimpan di Google Sheets dan website utama akan membaca angka terbaru.
    </div>
  </div>

  <div class="footer">TALENT OF STUDENT 2026</div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyGUkVLMueF3gznmgHjk4M4IwrRj6Aj61GHy_hXOrfU9wM4PcQ-90EKdMeFJN_LoFEg/exec";

function formatRupiah(n) {
  return new Intl.NumberFormat("id-ID", {
    style:"currency", currency:"IDR", maximumFractionDigits:0
  }).format(Number(n)||0);
}

function message(text,type) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "message " + type;
}

function callApi(params = {}) {
  return new Promise((resolve,reject) => {
    const callbackName = "tosCallback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    const query = new URLSearchParams({...params, callback:callbackName, t:Date.now()});

    const cleanup = () => { delete window[callbackName]; script.remove(); };
    const timer = setTimeout(() => { cleanup(); reject(new Error("Waktu permintaan habis.")); },15000);

    window[callbackName] = (data) => { clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error("Tidak bisa terhubung ke Google Apps Script.")); };
    script.src = API + "?" + query.toString();
    document.body.appendChild(script);
  });
}

function tampilkan(data) {
  if (!data.success) throw new Error(data.message || "Gagal mengambil data.");
  document.getElementById("targetAmount").value = Number(data.target)||0;
  document.getElementById("currentAmount").value = Number(data.current)||0;
  document.getElementById("displayTarget").textContent = formatRupiah(data.target);
  document.getElementById("displayCurrent").textContent = formatRupiah(data.current);
  document.getElementById("displayPercentage").textContent = (Number(data.percentage)||0).toFixed(0) + "%";
}

async function loadData() {
  try { tampilkan(await callApi({})); }
  catch(e) { message("❌ " + e.message, "error"); }
}

document.getElementById("saveButton").addEventListener("click", async () => {
  const target = Number(document.getElementById("targetAmount").value);
  const current = Number(document.getElementById("currentAmount").value);
  const button = document.getElementById("saveButton");

  if (!Number.isFinite(target) || target < 0) return message("❌ Target dana tidak valid.","error");
  if (!Number.isFinite(current) || current < 0) return message("❌ Dana terkumpul tidak valid.","error");
  if (target > 0 && current > target) return message("❌ Dana terkumpul tidak boleh lebih besar dari target.","error");

  button.disabled = true;
  button.textContent = "⏳ Menyimpan...";

  try {
    const data = await callApi({action:"update",target:target,current:current});
    tampilkan(data);
    message("✅ Dana berhasil diperbarui!","success");
  } catch(e) {
    message("❌ " + e.message,"error");
  } finally {
    button.disabled = false;
    button.textContent = "💾 Simpan Perubahan";
  }
});

loadData();
</script>
</body>
</html>
